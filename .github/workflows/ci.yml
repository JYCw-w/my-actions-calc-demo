name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build
        run: g++ -std=c++17 -I. calculator.cpp tests/test_calculator.cpp -o calc_test

      - name: Run tests
        run: ./calc_test
